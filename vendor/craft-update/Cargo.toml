# ShotoPhopEX: a copy of craft-update from storytold/craft-libs at rev
# 5c5e0d52c387c0a4ae2908a07e476d7584f60362 (crates/update), used through [patch] in the root
# Cargo.toml. Changes (search `ShotoPhopEX` in src/): self_update picks the download by every stem
# the app lists (App::stems), not just App::id, so ShotoPhopEX finds its shotophopex-<ver>-<os>-<arch>
# release files; the Windows Installer publisher is ShotoPhopEX. Bumping craft-libs' rev upstream
# does NOT update this copy: re-copy it and re-apply the changes (see README.md here).
[package]
name = "craft-update"
description = "Release checking, downloading, installing and self-updating for the Craft App Suite and ArtCraft Launcher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"
autotests = false

[lib]
harness = false

[lints.rust]
unsafe_code = "forbid"

[features]
oci_migration = []
default = []
suite = ["screen-testing", "craft-ui/suite"]
screen-testing = ["ui", "craft-ui/testing"]
ui = ["dep:egui", "dep:image", "dep:craft-ui", "dep:craft-host", "dep:craft-theme"]

[dependencies]
egui = { version = "0.37", default-features = false, optional = true }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c5e0d52c387c0a4ae2908a07e476d7584f60362", optional = true }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "5c5e0d52c387c0a4ae2908a07e476d7584f60362", optional = true }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "5c5e0d52c387c0a4ae2908a07e476d7584f60362", features = ["ui"], optional = true }
# Decodes the app icon the update dialogs show (`App::icon_png`); PNG only.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tempfile = "3"
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c5e0d52c387c0a4ae2908a07e476d7584f60362", features = ["suite"] }
flate2 = "1"

[target.'cfg(unix)'.dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
dunce = "1"
# `deflate-flate2` with flate2's default miniz_oxide backend, not zip's `deflate` (zopfli and
# zlib-rs): Cargo unifies flate2's features across an app, and zlib-rs would switch the whole
# app's flate2 to it, where level 1 is a static-Huffman mode that can make output larger than
# its input (Lightcraft's 16-bit ZIP TIFFs on Windows).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
winsafe = { version = "0.0.29", features = ["advapi", "kernel", "shell", "version"] }
verifysign = "1"
