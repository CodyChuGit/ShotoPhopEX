[package]
name = "gn-perception"
description = "Perception models of genai-native, run through ONNX Runtime: SAM 3 (text, point and box prompts to masks)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
png = { workspace = true }
# ONNX Runtime is loaded at run time from a directory the user points at (BYOR, like the
# weights): no bundled library, no build-time download, CUDA or CPU chosen per session.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "cuda"] }
# The CLIP byte-pair tokenizer, read from the model directory's tokenizer.json. Pure Rust:
# no oniguruma, no C++ suffix array.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[[bin]]
name = "gn-sam"
path = "src/bin/gn-sam.rs"
